<aside class="sidebar">
  <section class="widget">
    <h2>Recent Posts</h2>
    <ul class="recent-posts">
      {% for post in site.posts limit:6 %}
      <li>
        <a href="{{ post.url | relative_url }}" title="{{ post.title | escape }}">{{ post.title }}</a>
        <time datetime="{{ post.date | date_to_xmlschema }}">{{ post.date | date: "%Y-%m-%d" }}</time>
      </li>
      {% endfor %}
    </ul>
  </section>

  <section class="widget">
    <h2>关于本站</h2>
    <p class="widget-text">{{ site.description }}</p>
    <p class="widget-text">
      <a href="https://github.com/YuQi0704" target="_blank" rel="noopener">github.com/YuQi0704</a>
    </p>
  </section>
</aside>
