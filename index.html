---
layout: default
title: 首页
---
<section class="home">
  <h1 class="page-title">最新文章</h1>

  {% if site.posts.size == 0 %}
    <p class="muted">还没有文章。在 <code>_posts/</code> 里添加一个 Markdown 文件即可。</p>
  {% endif %}

  <ul class="post-list">
    {% for post in site.posts %}
    <li>
      <a class="post-link" href="{{ post.url | relative_url }}">{{ post.title }}</a>
      <p class="post-excerpt">{{ post.excerpt | strip_html | strip | truncate: 90 }}</p>
      <time datetime="{{ post.date | date_to_xmlschema }}">{{ post.date | date: "%Y-%m-%d" }}</time>
    </li>
    {% endfor %}
  </ul>
</section>
